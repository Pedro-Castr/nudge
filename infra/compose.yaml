services:
  database:
    container_name: "postgres-dev"
    image: "postgres:18.6"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 3s
      retries: 30
  express:
    build:
      context: ..
      dockerfile: infra/dockerfile.dev
    container_name: express-dev
    ports:
      - "3000:3000"
    env_file:
      - ../.env.development
    environment:
      POSTGRES_HOST: postgres-dev
    volumes:
      - ..:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/status'').then(()=>process.exit(0)).catch(()=>process.exit(1))"',
        ]
      interval: 1s
      timeout: 3s
      retries: 30
